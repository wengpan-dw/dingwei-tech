    <style>
      /* Leaflet 核心样式（内联，不依赖外部 CDN） */
      .leaflet-container{overflow:hidden;position:relative;background:#ddd;outline:0}
      .leaflet-container .leaflet-pane,.leaflet-container .leaflet-tile,.leaflet-container .leaflet-marker-icon,.leaflet-container .leaflet-marker-shadow,.leaflet-container .leaflet-tile-container{position:absolute;left:0;top:0}
      .leaflet-container .leaflet-tile{visibility:hidden}
      .leaflet-container .leaflet-tile-loaded{visibility:inherit}
      .leaflet-tile-pane{z-index:2}
      .leaflet-overlay-pane{z-index:4}
      .leaflet-shadow-pane{z-index:5}
      .leaflet-marker-pane{z-index:6}
      .leaflet-tooltip-pane{z-index:7}
      .leaflet-popup-pane{z-index:8}
      .leaflet-zoom-box{width:0;height:0}
      .leaflet-control{z-index:8;position:relative}
      .leaflet-top,.leaflet-bottom{position:absolute;z-index:9;pointer-events:none}
      .leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
      .leaflet-control{float:left;clear:both}
      .leaflet-fade-anim .leaflet-tile{will-change:opacity}
      .leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
      .leaflet-zoom-animated{transform-origin:0 0;transition:transform .25s cubic-bezier(0,0,0.25,1)}
      .leaflet-tile-container img{display:block}
      .leaflet-container img.leaflet-image-layer{max-width:none!important}
      .leaflet-container img.leaflet-tile{max-width:none!important;width:256px;height:256px;-webkit-user-select:none;-moz-user-select:none;user-select:none;mix-blend-mode:plus-lighter}
      .leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
      .leaflet-container a{color:#0078A8}
      .leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,0.65);border-radius:4px}
      .leaflet-bar a{display:block;text-align:center;text-decoration:none;background:#fff;border-bottom:1px solid #ccc;width:30px;height:30px;line-height:30px;color:#000}
      .leaflet-bar a:last-child{border-bottom:none;border-radius:0 0 4px 4px}
      .leaflet-bar a:first-child{border-radius:4px 4px 0 0}
      .leaflet-bar a:hover{background:#f4f4f4}
      .leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
      .leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px}
      .leaflet-popup-content{margin:13px 19px;line-height:1.4;min-width:120px}
      .leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
      .leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#fff;border:1px solid #999}
      .leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;padding:4px 4px 0 0;text-align:center;width:18px;height:14px;font:16px/14px Tahoma;color:#c3c3c3;text-decoration:none;font-weight:bold;background:transparent}
      .leaflet-control-attribution{background:#fff;background:rgba(255,255,255,0.7);margin:0;padding:0 5px;color:#333;font-size:11px}
      .leaflet-control-zoom a{display:block;text-align:center;text-decoration:none}
      .leaflet-control-zoom-in{font:bold 18px 'Lucida Console',Monaco,monospace}
      .leaflet-control-zoom-out{font:bold 22px 'Lucida Console',Monaco,monospace}
